[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "context-rot-needle-auditor"
version = "0.1.0"
description = "Measures middle-context attention decay risk, instruction dilution, and salience placement across structured prompt assemblies"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
context-rot-needle-auditor = "context_rot_needle_auditor.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["context_rot_needle_auditor*"]
